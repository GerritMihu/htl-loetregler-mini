[platformio]
default_envs = pico

[env]
monitor_speed = 115200
check_tool = cppcheck
check_skip_packages = yes
check_flags =
  cppcheck: --enable=warning,style,performance,portability
  cppcheck: --std=c11

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = picosdk
check_src_filters =
  +<src/>
  +<include/>
  +<lib/LoetreglerLogic/>
build_flags =
  -Wall
  -Wextra
  -std=c11

[env:native]
platform = native
test_framework = unity
build_flags =
  -std=c11
  -Wall
  -Wextra
  -Wpedantic
